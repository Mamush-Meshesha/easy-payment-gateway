#cloud-config
preserve_hostname: false
hostname: payment-gateway-lab
fqdn: payment-gateway-lab.local

users:
  - name: mamush
    groups: sudo, docker
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      # This will be injected by Terraform from the variable
      - ${ssh_public_key}

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - qemu-guest-agent
  - make

runcmd:
  # Install Docker using the official script
  - curl -fsSL https://get.docker.com -o get-docker.sh
  - sh get-docker.sh
  
  # Ensure the user has docker permissions
  - usermod -aG docker mamush
  
  # Start and enable QEMU guest agent (allows Terraform to get IP address)
  - systemctl start qemu-guest-agent
  - systemctl enable qemu-guest-agent
  
  # Ensure Docker is running
  - systemctl start docker
  - systemctl enable docker
