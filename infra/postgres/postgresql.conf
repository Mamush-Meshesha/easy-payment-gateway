# -----------------------------
# PostgreSQL configuration file
# -----------------------------
# Tuned for Payment Gateway (High Concurrency, ACID Compliance)

listen_addresses = '*'
max_connections = 500                   # High concurrent API requests
shared_buffers = 4GB                    # 25% of available RAM (assume 16GB DB server)
effective_cache_size = 12GB             # 75% of available RAM
maintenance_work_mem = 1GB              # Speed up index creation
checkpoint_completion_target = 0.9      # Spread out checkpoint I/O
wal_buffers = 16MB                      # Buffer for WAL
default_statistics_target = 100         # Optimizer statistics
random_page_cost = 1.1                  # Assume SSD storage
effective_io_concurrency = 200          # For SSDs
work_mem = 20MB                         # Per-connection memory for sorts

# Write-Ahead Log (WAL) & Durability
wal_level = logical                     # Required for CDC (Change Data Capture) if needed later
synchronous_commit = on                 # Absolute data safety for financial transactions
fsync = on                              # NEVER turn this off in a financial system

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = 'pg_log'
log_min_duration_statement = 1000       # Log slow queries > 1s
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
