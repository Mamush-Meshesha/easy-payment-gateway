# -----------------------------
# Redis Configuration File
# -----------------------------
# Tuned for Payment Gateway (Rate limiting, caching, fast limits)

bind 0.0.0.0
port 6379

# Memory Management
maxmemory 2gb                             # Limit memory usage
maxmemory-policy volatile-lru             # Evict only keys with an expiry (e.g. rate limit counters)
maxmemory-samples 5

# Persistence (AOF for durability)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec                      # Balance between performance and durability (1s max data loss)

# Snapshots (RDB)
save 900 1
save 300 10
save 60 10000

# Security (Placeholder, should be overridden by env vars in production)
# requirepass "SET_IN_ENV"

# Tuning
tcp-keepalive 300
timeout 0
tcp-backlog 511
