worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone for API requests
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/s;

    # Upstreams for load balancing
    upstream auth_service {
        server auth-service:3001;
    }

    upstream merchant_service {
        server merchant-service:3002;
    }

    upstream admin_service {
        server admin-service:3003;
    }

    upstream payment_service {
        server payment-service:8084;
    }

    upstream dashboard_service {
        server dashboard-service:3009;
    }

    upstream reporting_service {
        server reporting-service:3008;
    }

    upstream reconciliation_service {
        server reconciliation-service:3011;
    }

    upstream risk_service {
        server risk-service:8086;
    }

    upstream billing_service {
        server billing-service:3016;
    }

    upstream dispute_service {
        server dispute-service:3017;
    }

    upstream provider_service {
        server provider-service:8087;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name localhost;

        # SSL Configuration
        ssl_certificate /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # CORS headers for all responses
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Merchant-Id,Accept,Origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Universal CORS preflight handling for browser clients
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Routes
        location /api/v1/auth {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # KYC admin endpoints live in merchant-service (placed before /api/v1/admin)
        location /api/v1/admin/kyc {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://merchant_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/admin {
            proxy_pass http://admin_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/merchants {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://merchant_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Allow document uploads for KYC
            client_max_body_size 20M;
        }

        location /api/v1/dashboard {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://dashboard_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/reporting {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://reporting_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/reconciliation {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://reconciliation_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Allow large CSV statement file uploads
            client_max_body_size 50M;
        }

        location /api/v1/risk {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://risk_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/billing {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://billing_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/disputes {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://dispute_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/providers {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://provider_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/ledger {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://dashboard_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Specific: refund endpoint — always goes to payment-service
        location ~ ^/api/v1/payments/[^/]+/refund$ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Public checkout endpoint — goes to payment-service
        location ~ ^/api/v1/checkout/payments/[^/]+(/process)?$ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Specific: GET /api/v1/payments/:id — goes to Dashboard BFF
        location ~ ^/api/v1/payments/[^/]+$ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://dashboard_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Specific: GET /api/v1/refunds — goes to Dashboard BFF
        location /api/v1/refunds {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://dashboard_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # General: POST /api/v1/payments — create payment, goes to payment-service
        location = /api/v1/payments {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check for Nginx itself
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
