global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'payment_engine_go'
    static_configs:
      - targets: 
        - 'host.docker.internal:8081' # ledger
        - 'host.docker.internal:8082' # reconciliation
        - 'host.docker.internal:8083' # settlement
        - 'host.docker.internal:8084' # payment
        - 'host.docker.internal:8085' # risk
        - 'host.docker.internal:8086' # transaction
        - 'host.docker.internal:8087' # provider
        - 'host.docker.internal:8088' # webhook

  - job_name: 'payment_engine_ts'
    static_configs:
      - targets: 
        - 'host.docker.internal:3001' # auth
        - 'host.docker.internal:3002' # merchant
        - 'host.docker.internal:3003' # admin
        - 'host.docker.internal:3008' # reporting
        - 'host.docker.internal:3009' # dashboard
