# infra/kafka/mirrormaker.properties
# Kafka MirrorMaker 2.0 configuration for Multi-Region Active-Active Replication

clusters = us-cluster, eu-cluster

# Connection details
us-cluster.bootstrap.servers = kafka-us:9092
eu-cluster.bootstrap.servers = kafka-eu:9092

# Enable replication in both directions
us-cluster->eu-cluster.enabled = true
eu-cluster->us-cluster.enabled = true

# Topics to replicate (Regex support)
us-cluster->eu-cluster.topics = transaction.status.updated, merchant.events
eu-cluster->us-cluster.topics = transaction.status.updated, merchant.events

# Sync consumer group offsets so consumers can failover smoothly
sync.group.offsets.enabled = true
sync.group.offsets.interval.ms = 10000

# Do not replicate internal MirrorMaker topics
topics.blacklist = .*[\-\.]internal, .*\.replica, __.*

# Replication factor for internal MM2 topics
replication.factor = 1
