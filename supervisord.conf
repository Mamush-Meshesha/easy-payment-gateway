[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:nginx]
command=/bin/sh -c "sed -i \"s/listen 8080;/listen ${PORT:-8080};/g\" /etc/nginx/nginx.conf && /usr/sbin/nginx -g \"daemon off;\""
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=redis-server
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:auth-service]
directory=/app/services/auth-service
command=npm run start
autostart=true
autorestart=true
environment=PORT="",SERVICE_PORT="3001",GRPC_PORT="50051",MERCHANT_SERVICE_HOST="127.0.0.1",MERCHANT_GRPC_PORT="50052",MTLS_CA_CERT="/app/certs/ca.crt",MTLS_SERVER_CERT="/app/certs/auth-service.crt",MTLS_SERVER_KEY="/app/certs/auth-service.key"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:merchant-service]
directory=/app/services/merchant-service
command=npm run start
autostart=true
autorestart=true
environment=PORT="",SERVICE_PORT="3002",GRPC_PORT="50052",CERT_DIR="/app/certs",MTLS_CA_CERT="/app/certs/ca.crt",MTLS_SERVER_CERT="/app/certs/merchant-service.crt",MTLS_SERVER_KEY="/app/certs/merchant-service.key"
