autostart=true
autorestart=true
environment=PORT="",GRPC_PORT="50057",MERCHANT_SERVICE_ADDR="127.0.0.1:50052",RISK_SERVICE_ADDR="127.0.0.1:50054",LEDGER_SERVICE_ADDR="127.0.0.1:50053",PROVIDER_SERVICE_ADDR="127.0.0.1:50055",WEBHOOK_SERVICE_ADDR="127.0.0.1:50056",PRICING_SERVICE_ADDR="127.0.0.1:50064"
