version: '3.8'

services:
  zookeeper-eu:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2182
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2182:2182"
    networks:
      - payment_network

  kafka-eu:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper-eu
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-eu:2182
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-eu:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"
    networks:
      - payment_network

  mirrormaker2:
    image: confluentinc/cp-kafka-connect:7.4.0
    depends_on:
      - kafka # original us-kafka from main docker-compose
      - kafka-eu
    volumes:
      - ./infra/kafka/mirrormaker.properties:/etc/kafka/mirrormaker.properties
    command: 
      - /bin/bash
      - -c
      - |
        echo "Starting MirrorMaker 2.0"
        connect-mirror-maker /etc/kafka/mirrormaker.properties
    networks:
      - payment_network

networks:
  payment_network:
    external: true
