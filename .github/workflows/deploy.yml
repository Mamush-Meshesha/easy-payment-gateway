name: Payment Gateway CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-to-production:
    name: Deploy to Production (AWS EC2)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Sync Code & Deploy to EC2
        env:
          VM_IP: ${{ secrets.PROD_SERVER_IP || '13.49.76.65' }}
        run: |
          # 1. Ensure target directory exists on EC2
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@$VM_IP "mkdir -p /home/ubuntu/payment-gateway"

          # 2. Sync repository codebase to EC2
          rsync -avz \
                     --exclude 'node_modules' \
                     --exclude '.git' \
                     --exclude 'logs' \
                     --exclude 'venv' \
                     --exclude '.env.local' \
                     --exclude '.env' \
                     -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
                     ./ ubuntu@$VM_IP:/home/ubuntu/payment-gateway/

          # 3. SSH into EC2 and launch the microservices stack
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@$VM_IP << 'EOF'
            set -e
            cd /home/ubuntu/payment-gateway
            
            # Setup environment file if not already present
            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            # Clean any old build cache and prune unused docker resources
            sudo docker builder prune -af || true
            sudo docker system prune -f || true

            # Clean any stray local binaries or venvs if present
            find services -name 'main' -o -name 'app' -o -name 'server' | xargs -r rm -f || true
            rm -rf services/risk-ml-worker/venv || true

            # Make scripts executable and generate mTLS certs
            chmod +x infra/scripts/*.sh || true
            bash infra/scripts/generate-mtls.sh

            # Build and deploy with concurrency limit to prevent disk exhaustion
            COMPOSE_PARALLEL_LIMIT=2 sudo docker compose -f docker-compose.yml up -d --build
            
            echo "✅ Deployment successful!"
            sudo docker compose ps
          EOF

