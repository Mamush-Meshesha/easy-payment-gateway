name: Payment Gateway CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Run Tests & Linters
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Go Tests
        run: |
          for dir in services/*/; do
            if [ -f "$dir/go.mod" ]; then
              cd $dir && go test ./... || true && cd ../../
            fi
          done

      - name: Run Node Tests
        run: |
          for dir in services/*/; do
            if [ -f "$dir/package.json" ]; then
              cd $dir && npm install --silent && npm test --if-present || true && cd ../../
            fi
          done

  deploy-to-production:
    name: Deploy to Production (AWS EC2)
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PROD_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Sync Code & Deploy to EC2
        env:
          VM_IP: ${{ secrets.PROD_SERVER_IP }}
        run: |
          # 1. Ensure target directory exists on EC2
          ssh -o StrictHostKeyChecking=no ubuntu@$VM_IP "mkdir -p /home/ubuntu/payment-gateway"

          # 2. Sync repository codebase to EC2
          rsync -avz \
                     --exclude 'node_modules' \
                     --exclude '.git' \
                     --exclude 'logs' \
                     --exclude 'venv' \
                     --exclude '.env.local' \
                     --exclude '.env' \
                     -e "ssh -o StrictHostKeyChecking=no" \
                     ./ ubuntu@$VM_IP:/home/ubuntu/payment-gateway/

          # 3. SSH into EC2 and launch the microservices stack
          ssh -o StrictHostKeyChecking=no ubuntu@$VM_IP << 'EOF'
            set -e
            cd /home/ubuntu/payment-gateway
            
            # Setup environment file if not already present
            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            # Make scripts executable and generate mTLS certs
            chmod +x infra/scripts/*.sh || true
            bash infra/scripts/generate-mtls.sh

            # Build and deploy all services
            sudo docker compose -f docker-compose.yml up -d --build
            
            echo "✅ Deployment successful!"
            sudo docker compose ps
          EOF

