syntax = "proto3";

package webhook_read;
option go_package = "payment-gateway/webhook-service/proto";

service WebhookReadService {
  rpc GetWebhookDeliveries (GetWebhookDeliveriesRequest) returns (GetWebhookDeliveriesResponse);
}

message GetWebhookDeliveriesRequest {
  string merchant_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message WebhookDelivery {
  string id = 1;
  string merchant_id = 2;
  string event_id = 3;
  string event_type = 4;
  string status = 5;
  int32 attempt_count = 6;
  int32 response_status_code = 7;
  string response_body = 8;
  string created_at = 9;
  string next_retry_at = 10;
  string last_error = 11;
  string payload = 12;
}

message GetWebhookDeliveriesResponse {
  repeated WebhookDelivery deliveries = 1;
  int32 total = 2;
}
