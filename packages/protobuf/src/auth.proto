syntax = "proto3";

package auth;
option go_package = "payment-gateway/proto";

service AuthService {
  rpc ProvisionMerchantOwner (ProvisionRequest) returns (ProvisionResponse);
}

message ProvisionRequest {
  string merchantId = 1;
  string email = 2;
  string legalName = 3;
}

message ProvisionResponse {
  bool success = 1;
  string userId = 2;
  string error = 3;
}
